[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspection-report-builder"
version = "0.1.0"
description = "Transforms Yardi inspection reports into Fernwater-branded owner-ready PDFs."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "playwright>=1.40",
    "anthropic>=0.30",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
inspection-report = "inspection_report.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inspection_report.render" = ["templates/*.html", "static/*.css"]
